el.innerHTML=`${sel.size?bulkBar():''}<div class="cd tbl">${head()}${r.slice(a,a+PS).map(rowH).join('')}</div>${pages>1?`<div class="pgr"><small>Showing ${a+1}–${Math.min(a+PS,r.length)} of ${r.length}</small><div><button class="bt gh" ${pg<2?'disabled':''} onclick="pg--;lst()">Previous</button> <button class="bt gh" ${pg>=pages?'disabled':''} onclick="pg++;lst()">Next</button></div></div>`:''}`}
function calHtml(){const f=new Date(cal.y,cal.m,1),dn=new Date(cal.y,cal.m+1,0).getDate();let c='';
for(let i=0;i<f.getDay();i++)c+='<div class="cx o"></div>';

c+=`<div class="cx ${ds===today()?'td':''}"><span>${d}</span>${allRounds().filter(({x})=>x.d===ds).map(({j,x})=>`<button class="ch" onclick="go('job','${j.id}')">${E(j.co)}${x.tm?' '+E(x.tm):''}</button>`).join('')}${S.rem.filter(r=>r.d===ds&&!r.done).map(r=>`<span class="ch r">${E(r.t)}</span>`).join('')}</div>`}
return `<div class="cd"><div class="cal-h"><b>${f.toLocaleString('en',{month:'long',year:'numeric'})}</b><div><button class="ib" aria-label="Previous month" onclick="cmv(-1)">${I('chev')}</button><button class="ib" aria-label="Next month" onclick="cmv(1)" style="transform:scaleX(-1)">${I('chev')}</button></div></div><div class="cg">${'SMTWTFS'.split('').map(x=>`<small class="wd">${x}</small>`).join('')}${c}</div></div>`}
